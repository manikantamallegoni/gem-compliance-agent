<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeM Compliance Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 p-6 text-slate-900">
<div class="max-w-4xl mx-auto bg-white p-6 rounded-xl shadow-sm border">
    <h1 class="text-xl font-bold mb-4 text-indigo-900">GeM Compliance Auditor UI</h1>

    <form id="auditForm" class="space-y-4">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label class="block text-xs font-bold uppercase mb-1">Tender ID</label>
                <input type="text" id="tender_id" name="tender_id" value="GEM/2026/B/2002" class="w-full p-2 border rounded text-sm" required>
            </div>
            <div>
                <label class="block text-xs font-bold uppercase mb-1">Bidder Name</label>
                <input type="text" id="bidder_name" name="bidder_name" value="Tech Corp" class="w-full p-2 border rounded text-sm" required>
            </div>
        </div>

        <div>
            <label class="block text-xs font-bold uppercase mb-1">Requirements</label>
            <textarea id="tender_requirements" name="tender_requirements" rows="2" class="w-full p-2 border rounded text-sm" required>Minimum turnover of 50 Lakhs INR required. Valid PAN Card & GSTIN mandatory.</textarea>
        </div>

        <!-- Document Uploads Section -->
        <div class="space-y-3 border-t pt-4 mt-4">
            <h3 class="text-xs font-bold uppercase text-slate-700 tracking-wider">Compliance Documents & Verification Proofs</h3>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                <!-- PAN Card Document -->
                <div class="p-3 border rounded-lg bg-slate-50">
                    <label class="block text-xs font-semibold text-slate-700 mb-1">PAN Card Proof</label>
                    <input type="file" id="pan_file" name="pan_file" accept=".pdf,.docx,.txt" class="block w-full text-xs text-slate-500 file:mr-2 file:py-1 file:px-2 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100" />
                </div>

                <!-- GST Certificate -->
                <div class="p-3 border rounded-lg bg-slate-50">
                    <label class="block text-xs font-semibold text-slate-700 mb-1">GST Certificate</label>
                    <input type="file" id="gst_file" name="gst_file" accept=".pdf,.docx,.txt" class="block w-full text-xs text-slate-500 file:mr-2 file:py-1 file:px-2 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100" />
                </div>

                <!-- Financial Statement / Turnover Proof -->
                <div class="p-3 border rounded-lg bg-slate-50">
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Financial Turnover Proof</label>
                    <input type="file" id="financial_file" name="financial_file" accept=".pdf,.docx,.txt" class="block w-full text-xs text-slate-500 file:mr-2 file:py-1 file:px-2 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100" />
                </div>
            </div>

            <!-- Main Bid Document -->
            <div class="p-3 border rounded-lg bg-indigo-50/40">
                <label class="block text-xs font-bold text-slate-800 mb-1">Main Tender Bid Document (.pdf, .docx, .txt)</label>
                <input type="file" id="fileInput" name="file" accept=".pdf,.docx,.txt" class="block w-full text-xs text-slate-500 file:mr-3 file:py-1.5 file:px-3 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-700" required />
            </div>
        </div>

        <button type="submit" id="btn" class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2.5 rounded text-sm font-semibold transition-colors shadow-sm">Run Audit</button>
    </form>

    <div id="resultsContainer" class="mt-6"></div>
</div>

<script>
    document.getElementById('auditForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const resultsContainer = document.getElementById('resultsContainer');
        const submitBtn = document.getElementById('btn');

        resultsContainer.innerHTML = `
            <div class="mt-4 p-4 border rounded-lg bg-indigo-50 text-indigo-700 font-medium text-sm flex items-center gap-2">
                <svg class="animate-spin h-5 w-5 text-indigo-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                Running compliance evaluation via agent...
            </div>
        `;
        submitBtn.disabled = true;

        const formData = new FormData(e.target);

        try {
            const response = await fetch('/audit', {
                method: 'POST',
                body: formData
            });

            if (!response.ok) {
                throw new Error(`Server returned status ${response.status}`);
            }

            const data = await response.json();
            renderAuditReport(data, resultsContainer);
        } catch (err) {
            resultsContainer.innerHTML = `
                <div class="mt-4 p-4 border border-red-200 bg-red-50 text-red-700 rounded-lg text-sm font-medium">
                    Error during evaluation: ${err.message}
                </div>
            `;
        } finally {
            submitBtn.disabled = false;
        }
    });

    function renderAuditReport(data, container) {
        const isCompliant = data.overall_status === 'COMPLIANT';
        const isNonCompliant = data.overall_status === 'NON_COMPLIANT';

        const badgeBg = isCompliant ? 'bg-green-600' : (isNonCompliant ? 'bg-red-600' : 'bg-amber-600');

        let html = `
            <div class="border rounded-xl p-5 bg-white shadow-sm space-y-4">
                <div class="flex justify-between items-center border-b pb-3">
                    <h3 class="text-base font-bold text-slate-800">Audit Results for Tender: ${data.tender_id || 'N/A'}</h3>
                    <span class="${badgeBg} text-white px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wide">
                        ${data.overall_status}
                    </span>
                </div>

                <div class="text-xs space-y-1 text-slate-700">
                    <p><strong>Bidder Name:</strong> ${data.bidder_name || 'N/A'}</p>
                    <p><strong>Summary:</strong> ${data.summary || 'No summary provided.'}</p>
                </div>

                <div class="mt-4">
                    <h4 class="text-xs font-bold uppercase text-slate-500 mb-2">Clause Breakdown</h4>
                    <div class="overflow-x-auto border rounded-lg">
                        <table class="w-full text-left text-xs border-collapse">
                            <thead>
                                <tr class="bg-slate-100 text-slate-700 font-semibold border-b">
                                    <th class="p-2.5 border-r">Requirement</th>
                                    <th class="p-2.5 border-r">Status</th>
                                    <th class="p-2.5 border-r">Actual Value</th>
                                    <th class="p-2.5">Reasoning</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-100">
        `;

        if (data.evaluations && data.evaluations.length > 0) {
            data.evaluations.forEach(item => {
                const itemCompliant = item.status === 'COMPLIANT';
                const itemColor = itemCompliant ? 'text-green-600 font-bold' : 'text-red-600 font-bold';

                html += `
                    <tr class="hover:bg-slate-50">
                        <td class="p-2.5 border-r font-medium text-slate-900">${item.requirement_name}</td>
                        <td class="p-2.5 border-r ${itemColor}">${item.status}</td>
                        <td class="p-2.5 border-r text-slate-700">${item.actual_value || 'N/A'}</td>
                        <td class="p-2.5 text-slate-600">${item.reasoning}</td>
                    </tr>
                `;
            });
        } else {
            html += `
                <tr>
                    <td colspan="4" class="p-3 text-center text-slate-400">No evaluation clauses returned.</td>
                </tr>
            `;
        }

        html += `
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        `;

        container.innerHTML = html;
    }
</script>
</body>
</html>
